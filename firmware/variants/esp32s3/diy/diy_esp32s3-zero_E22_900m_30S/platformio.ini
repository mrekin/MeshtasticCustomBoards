[env:diy_esp32s3-zero_E22_900m_30S]
extends = esp32s3_base
board = esp32-s3-zero
board_level = extra
build_src_filter =
  ${esp32s3_base.build_src_filter}
  +<../variants/esp32s3/diy/diy_esp32s3-zero_E22_900m_30S>
build_flags = 
  ${esp32s3_base.build_flags} -I variants/esp32s3/diy/diy_esp32s3-zero_E22_900m_30S
  -D PRIVATE_HW
  -D GPS_POWER_TOGGLE
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_MODE=1 ; USB-Serial-JTAG: flashing without the BOOT button (sealed case)
  -ULED_BUILTIN