[env:diy_esp32s3_n16r8_e22900m30s]
extends = esp32s3_base
board_level = extra
board = heltec_wireless_tracker
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB ;Specify the FLASH capacity as 16MB
board_build.arduino.memory_type = qio_opi ;Enable internal PSRAM
upload_protocol = esptool
lib_deps =
  ${esp32s3_base.lib_deps}
build_flags =
  ${esp32s3_base.build_flags}
  -I variants/esp32s3/diy/diy_ESP32S3_N16R8_E22900M30S
  -D PRIVATE_HW
  -D BOARD_HAS_PSRAM
  -D GPS_POWER_TOGGLE
  -D OLED_RU

; UART-флейвор: консоль на UART0, USB CDC выключен. board_build.extra_flags
; целиком заменяет extra_flags борда heltec_wireless_tracker (там CDC_ON_BOOT=1),
; поэтому конфликтных дублей -D не возникает.
[env:diy_esp32s3_n16r8_e22900m30s_uart]
extends = esp32s3_base
board_level = extra
board = heltec_wireless_tracker
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB ;Specify the FLASH capacity as 16MB
board_build.arduino.memory_type = qio_opi ;Enable internal PSRAM
upload_protocol = esptool
lib_deps =
  ${esp32s3_base.lib_deps}
board_build.extra_flags =
  -DHELTEC_WIRELESS_TRACKER
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_RUNNING_CORE=1
  -DARDUINO_EVENT_RUNNING_CORE=1
build_flags =
  ${esp32s3_base.build_flags}
  -I variants/esp32s3/diy/diy_ESP32S3_N16R8_E22900M30S
  -D PRIVATE_HW
  -D BOARD_HAS_PSRAM
  -D GPS_POWER_TOGGLE
  -D SX126X_DIO2_AS_RF_SWITCH
  -D OLED_RU