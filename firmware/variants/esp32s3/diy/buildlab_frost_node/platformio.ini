; BuildLab Frost Node. The builds differ only in the INA3221 CH3 shunt (INA3221_SHUNT_R_CH3)
; and the LoRa module (E22-900M30S, or E22P-868M30S with BUILDLAB_FROST_E22P).

[env:buildlab_frost_node_10mohm]
extends = esp32s3_base
board_level = extra
board = heltec_wireless_tracker
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB ;Specify the FLASH capacity as 16MB
board_build.arduino.memory_type = qio_opi ;Enable internal PSRAM
upload_protocol = esptool
build_src_filter =
  ${esp32s3_base.build_src_filter}
  +<../variants/esp32s3/diy/buildlab_frost_node>
build_flags =
  ${esp32s3_base.build_flags}
  -I variants/esp32s3/diy/buildlab_frost_node
  -D PRIVATE_HW
  -D BOARD_HAS_PSRAM
  -D GPS_POWER_TOGGLE
  -D INA3221_SHUNT_R_CH3=0.01f

